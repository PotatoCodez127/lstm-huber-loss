name: Continuous Integration Gatekeeper

on:
  push:
    branches: [ main, master, devel ]
  pull_request:
    branches: [ main, master, devel ]

jobs:
  verify-and-test:
    name: Validation Suite (Ubuntu / Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Provision Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Configure Global System Metrics
        run: |
          sudo timedatectl set-timezone UTC
          echo "TZ=UTC" >> $GITHUB_ENV

      - name: Upgrade Pipeline Package Core
        run: |
          python -m pip install --upgrade pip
          pip install wheel

      - name: Install Architecture Dependencies
        run: |
          pip install .[dev]

      - name: Execute Code Formatting Verification (Black)
        run: |
          black --check .

      - name: Execute Static Analysis & Lint Gates (Ruff)
        run: |
          ruff check .

      - name: Execute Automated Regression Testing (PyTest)
        run: |
          pytest test_lstm.py -v